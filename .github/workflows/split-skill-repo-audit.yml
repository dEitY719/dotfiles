name: split-skill-repo-audit

# Audits the #1410 split-out skill repos against this repo's registration
# (issue #1671). Two questions nothing else asks:
#
#   F-1  Is `<plugin>@<marketplace>` from claude/plugin/plugins.json actually
#        installable? tests/bats/tools/claude_plugin_scaffold.bats only checks
#        the two JSON files against a table in its own source, so a remote
#        rename or a deleted repo leaves the suite green and every
#        `/plugin install` broken.
#
#   F-2  Have the split copies drifted from the claude/skills/ originals that
#        #1410 NF-1 keeps alive until Phase 4? Two live copies of every skill,
#        with nothing watching them, is the whole reason this exists.
#
# Why it is a workflow and not a test (#1671 NF-1):
#   Both checks need the network. `mise run test` is offline and runs in
#   parallel worktrees, so a slow or blocked github.com would turn into
#   unrelated red in everyone's pre-push hook. The pure logic IS tested,
#   offline, in tests/integration/test_split_skill_repos.py — only the
#   fetching happens here.
#
# Expect drift findings while Phase 2-3 is in flight: they report a gap that
# already exists, and the run is gated with `--fail-on contract` so they do
# not turn the workflow permanently red. F-1 breakage still fails the job the
# moment it appears. Phase 4 drains the drift half by deleting the originals,
# after which every skill is legitimately unpaired and `--fail-on` can go.
#
# Be clear about what that costs while it lasts: NOTHING in the drift half
# fails this job — not a drifted skill, and not the "unpaired beside a paired
# sibling" finding either. Those reach humans only through the job summary
# below. `mise run audit-split-repos` runs the same checker with the default
# `--fail-on any`, and that is the invocation where drift actually gates.

on:
  schedule:
    # 03:17 UTC Mondays. Off the hour because GitHub queues scheduled runs at
    # :00 across every repo on the platform, which delays them by 10+ minutes.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      check:
        description: "Which half to run"
        type: choice
        default: all
        options: [all, contract, drift]
  # A change to the registration SSOT is the one push worth auditing
  # immediately — it is exactly when a name can stop matching its remote.
  # Only on main: a registration is not real until it is merged, every other
  # workflow here pins its branches the same way (ci.yml, test.yml), and a
  # topic branch editing a skill would otherwise fire a full clone audit of
  # every split repo on every push (agy FOLLOW-UP). Drift becomes real when it
  # lands on main, which is exactly what this filter watches.
  push:
    branches: [main]
    paths:
      - "claude/plugin/marketplaces.json"
      - "claude/plugin/plugins.json"
      - "scripts/maintenance/check_split_skill_repos.py"
      # Source-side drift: editing an original here is one of the two ways
      # the two copies diverge, and waiting a week to hear about it is the
      # gap this closes (codex FOLLOW-UP).
      - "claude/skills/**"

permissions:
  contents: read

concurrency:
  group: split-skill-repo-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Contract + drift
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout dotfiles
        uses: actions/checkout@v4

      # The checker shallow-clones each split repo itself; no token beyond the
      # default is needed while every `dEitY719/*-skills` repo is public. A
      # repo turning private surfaces as an "unreachable" F-1 finding rather
      # than a silent skip, which is the intended failure mode.
      # The exit code is gated with `--fail-on contract`, never by swallowing
      # it. `| tee` under the runner's default `bash -e` (no pipefail) returns
      # tee's status, so a failing audit reported success — the whole gate was
      # inert (PR #1691 review, agy BLOCKER). `shell: bash` restores pipefail,
      # and the checker itself decides what is worth failing on: an install id
      # the remote no longer honors always is; Phase 2-3 drift is expected and
      # is reported to the job summary instead. Phase 4 can drop `--fail-on`.
      #
      # The input goes through `env:` rather than being interpolated into the
      # script (agy FOLLOW-UP) — `type: choice` makes it safe today, but the
      # env indirection is the pattern that stays safe if the type changes.
      - name: Run the audit
        shell: bash
        env:
          CHECK: ${{ inputs.check || 'all' }}
        run: |
          # `--fail-on contract` gates on the F-1 half, so it is incoherent
          # with `--check drift` (which never runs that half) and the checker
          # refuses the pair rather than exiting a silent 0. A drift-only run
          # is only ever a manual dispatch — someone asking to see the drift
          # half — so that one gates on what it actually ran.
          FAIL_ON=contract
          if [ "$CHECK" = "drift" ]; then
            FAIL_ON=any
          fi
          python3 scripts/maintenance/check_split_skill_repos.py \
            --check "$CHECK" --fail-on "$FAIL_ON" | tee audit.log

      - name: Publish findings to the job summary
        if: always()
        run: |
          {
            echo "## Split-skill-repo audit (#1671)"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' audit.log || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
