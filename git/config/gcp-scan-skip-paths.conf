# git/config/gcp-scan-skip-paths.conf
#
# Path-based skip list for `gcp scan` (path-excluded bucket).
#
# Companion to the SHA-based gcp-scan-skip.conf, solving a DIFFERENT problem.
# The SHA list silences ONE specific commit; a path never changes, so this
# list silences a whole CLASS of commits by their changed-file-set — no matter
# how many new SHAs the class spawns.
#
# Motivating case (RESOLVED at the root by #1685 — kept as documentation of
# what this mechanism is for): `claude/hooks/plugin-sync.sh` used to auto-commit
# `chore(claude-plugin): sync manifest` every time a Claude plugin was
# installed/removed, touching claude/plugin/{marketplaces,plugins}.json — files
# that recorded which plugins were installed on THIS machine (SSOT is the
# machine-local, non-git-tracked ~/.claude-shared/plugins/ — see
# claude/plugin/reconcile.sh). Upstream's machine and this one have divergent
# plugin sets by design and were never meant to converge, so every install
# produced a NEW commit with a NEW SHA and this exact subject. Registering each
# SHA in gcp-scan-skip.conf was whack-a-mole; a PATH allowlist stopped it.
#
# #1685 removed the cause instead: those tracked files now hold ONLY the
# upstream-owned registration contract, and this machine's install state lives
# in the gitignored claude/plugin/{marketplaces,plugins}.local.json overlay. An
# untracked overlay produces no commit at all, so the manifest entries were
# retired from the list below. The path-allowlist mechanism itself stays — it
# is the right tool the next time a whole CLASS of commits needs silencing.
#
# The list being empty is a valid state: `gcp scan --show-skip-paths` reports
# "(file present but no paths registered)" and nothing is path-excluded.
#
# Matching rule: a commit is skipped as "path-excluded" when its changed-file
# set is NON-EMPTY and EVERY changed path exactly matches one entry below. A
# commit that also touches any other file still surfaces (it carries real,
# unrelated content).
#
# Format: one LITERAL path per line; everything after `#` is a free-text
# reason. Entries are compared by string EQUALITY — glob metacharacters
# (`*`, `?`, `[`) are NOT interpreted, so a stray `*` cannot match every file.
# Limitation: a tracked path containing a literal `#` cannot be registered
# here (the `#` and everything after it is always parsed as the comment) —
# same constraint as the sibling gcp-scan-skip.conf's SHA format.
#
# Notes:
#   - The list is IGNORED under `gcp scan --author=all` so full detection
#     (the safety net) is never silenced.
#   - View the active list with `gcp scan --show-skip-paths`.
#   - Override the file path with the GCP_SCAN_SKIP_PATHS_FILE env var.

# (no paths registered — see the #1685 note above)
