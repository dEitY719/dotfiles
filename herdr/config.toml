# herdr (agent multiplexer) configuration
# Managed via dotfiles symlink:
#   ~/.config/herdr/config.toml -> ~/dotfiles/herdr/config.toml
# Apply edits without restarting the server: `herdr server reload-config`

onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

# The nord theme renders the "tab" and "agent" tokens dim by default, which
# made the tab label (e.g. "merge-train") and the second-row worktree/branch
# label (e.g. "wt-dotfiles-issue-1527") read as low-contrast.
[ui.sidebar.agents]
rows = [
    ["state_icon", "workspace", { token = "tab", dim = false }],
    [{ token = "agent", dim = false }],
]

[ui.toast]
delivery = "herdr"

[theme]
name = "nord"
auto_switch = false

[experimental]
pane_history = true
kitty_graphics = true

# Custom bindings use prefix+ctrl+<letter> to avoid colliding with built-in
# actions. `herdr config check` validates syntax but NOT key collisions.

# --- type = "plugin_action" (requires the named plugin to be installed) ---

[[keys.command]]
key = "prefix+ctrl+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer"

[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

# --- type = "popup" (plain binary on PATH, not a plugin) ---

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"
