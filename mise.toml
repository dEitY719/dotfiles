# mise.toml — Tool versions + task SSOT (issue #722, PR 1: dual-spec)
#
# Coexists with tox.ini during the migration window. Both runners
# produce equivalent results for the same target; tox.ini is removed
# in PR 5.
#
# Bootstrap (one-time, per machine):
#   curl https://mise.run | sh        # or `brew install mise`
#   mise install                       # installs pinned tool versions
#
# Daily use:
#   mise run lint   # ruff + mypy + shellcheck + shfmt -d   (read-only)
#   mise run test   # ./tests/test (bats + pytest + golden rules)
#   mise run fix    # ruff --fix + ruff format + shfmt -w   (mutating)
#
# References:
#   https://mise.jdx.dev/
#   docs/.ssot/command-design-pattern.md  — devx wrapper SSOT (PR 2)

[tools]
shellcheck = "0.10.0"
shfmt      = "3.8.0"
uv         = "0.10.12"
# ruff version is pinned in pyproject.toml's dev group; mise here is a
# fallback for environments that need the binary outside `uv run`.

[env]
DOTFILES_ROOT = "{{ config_root }}"

# ─── Lint gates (read-only) ──────────────────────────────────────────
[tasks.lint]
description = "전체 lint (Python + Shell + Docs)"
depends     = ["lint-py", "lint-sh", "lint-docs"]

[tasks.lint-py]
description = "Python lint (ruff check + format check + mypy)"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run mypy .",
]

[tasks.lint-sh]
description = "Shell lint (shellcheck + shfmt diff)"
# shellcheck scope covers bash/ + shell-common/ (#1305). shell-common/.shellcheckrc
# pins shell=bash so its bash/zsh-branching files don't get flagged with POSIX-sh
# false positives (SC3xxx). shfmt stays bash/-only — shell-common/'s formatting
# conventions diverge widely and reformatting it is a separate effort.
run = [
    'find bash shell-common -type f \( -name "*.sh" -o -name "*.bash" \) -exec shellcheck -x -e SC1090,SC1091 {} +',
    "shfmt -d -i 4 bash/",
]

[tasks.lint-docs]
description = "Docs 린터 (파일명 kebab-case #1027)"
# adr/ + requirement/ 는 강제(FAIL), 나머지 docs/ 는 warn-only.
# 레거시 위반 일괄 정리는 별도 이슈로 분리한다.
# changelog fragment 검사(scripts/lint_changelog_fragments.sh) 중단(2026-09-02) —
# 근거/재개 조건은 CLAUDE.md "변경 기록 (changelog)" 가 SSOT.
# ${SHELL_COMMON} $HOME 폴백 린터(#1612)는 이 게이트에서 빠졌다 — 검사 대상인
# 스킬 마크다운이 #1680 으로 marketplace repo 로 옮겨가 이 저장소에 남아 있지
# 않다. 스크립트는 남아 있고 CLAUDE_SKILLS_DIR 로 해당 repo 를 가리켜 수동 실행한다.
run = [
    "sh scripts/lint_docs_filenames.sh",
]

# ─── Test gate ───────────────────────────────────────────────────────
[tasks.test]
description = "전체 테스트 (bats + pytest + golden rules)"
# `uv run` keeps tests/test inside the project venv so pytest + xdist
# + pexpect resolve without a separate activation step (CI parity —
# see #727 / .github/workflows/ci.yml).
run = "uv run ./tests/test"

# ─── Auto-fix (mutating) ─────────────────────────────────────────────
[tasks.fix]
description = "전체 auto-fix (ruff + shfmt)"
depends     = ["fix-py", "fix-sh"]

[tasks.fix-py]
description = "Python auto-fix (ruff check --fix + ruff format)"
run = [
    "uv run ruff check --fix .",
    "uv run ruff format .",
]

[tasks.fix-sh]
description = "Shell auto-format (shfmt -w)"
run = "shfmt -w -i 4 bash/"

# ─── Network audits (never part of `test` — #1671 NF-1) ──────────────
[tasks.audit-split-repos]
description = "#1410 분리 레포 원격 계약 + 드리프트 감사 (네트워크 필요)"
# `mise run test` 는 오프라인·워크트리 병렬 실행이 전제라 여기에 넣지 않는다.
# 정기 실행은 .github/workflows/split-skill-repo-audit.yml, 이 태스크는 수동 호출용.
# 규칙과 근거는 scripts/maintenance/check_split_skill_repos.py 헤더가 SSOT.
run = "python3 scripts/maintenance/check_split_skill_repos.py"
