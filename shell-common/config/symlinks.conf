# Symbolic Link Management Configuration
# Single Source of Truth (SSOT) for all dotfiles symlinks
#
# Format: TARGET_PATH|SOURCE_PATH|DESCRIPTION
# - Paths use ${HOME} for environment independence
# - Scripts expand variables when creating/verifying links

# Work Log Management
${HOME}/work_log.txt|${HOME}/para/archive/playbook/logs/work_log.txt|Work log (symlink to playbook)

# SSH Configuration
${HOME}/.ssh/config|${HOME}/dotfiles/ssh/config|SSH config (managed by dotfiles)

# Ghostty Terminal
${HOME}/.config/ghostty/config|${HOME}/dotfiles/ghostty/config|Ghostty terminal config

# tmux
${HOME}/.tmux.conf|${HOME}/dotfiles/tmux/tmux.conf|tmux config

# Obsidian CLI wrapper (issue #1023) — executable on PATH so AI agents'
# non-interactive `bash -c "obsidian ..."` calls resolve it too.
${HOME}/.local/bin/obsidian|${HOME}/dotfiles/obsidian/bin/obsidian|Obsidian CLI wrapper (managed by dotfiles)

# herdr (agent multiplexer) — the running server reads the live path, so the
# symlink is what makes the dotfiles copy authoritative.
${HOME}/.config/herdr/config.toml|${HOME}/dotfiles/herdr/config.toml|herdr config (managed by dotfiles)

# Hermes Agent (#1373) — secrets stay out of this file; hermes/setup.sh injects
# model.api_key via `hermes config set` from a gitignored local file.
${HOME}/.hermes/config.yaml|${HOME}/dotfiles/hermes/config.yaml|hermes config (managed by dotfiles)
