# Hermes Agent (#1373) — deliberately NOT listed here. ~/.hermes/config.yaml is
# copied once from hermes/config.yaml by hermes/setup.sh Part 1, never
# symlinked: hermes rewrites that file itself (OAuth setup, model selection,
# _config_version), and a symlink would push those writes through into the
# tracked template. Re-adding an entry here would restore that leak.
