# Symbolic Link Management Configuration
# Single Source of Truth (SSOT) for all dotfiles symlinks
#
# Format: TARGET_PATH|SOURCE_PATH|DESCRIPTION[|OPTS]
# - Applied by ./setup.sh's `symlinks` step (symlink-manager.sh init, #2139).
#   A new dotfiles symlink is a row here — never an `ln -s` in a module setup.sh.
# - OPTS (optional 4th field, space-separated):
#     mode=public,external   link only in these setup modes (~/.dotfiles-setup-mode)
#     on-mismatch=keep       warn and leave an existing different file/link alone
#                            (default: back it up to <target>.original, then link)
#     allow-dir              allow replacing a real directory at TARGET_PATH
# - A SOURCE_PATH outside the checkout that does not exist is skipped (per-PC
#   content such as the playbook work log), not treated as a failure.
# - Paths use ${HOME} and ${DOTFILES_ROOT} for environment independence
# - symlink-manager.sh expands ${DOTFILES_ROOT} to the checkout's physical
#   path (pwd -P), so a checkout reached through a symlink (or not cloned at
#   ~/dotfiles) links the same sources every run

# Work Log Management
${HOME}/work_log.txt|${HOME}/para/archive/playbook/logs/work_log.txt|Work log (symlink to playbook)|on-mismatch=keep

# SSH Configuration
${HOME}/.ssh/config|${DOTFILES_ROOT}/ssh/config|SSH config (managed by dotfiles)

# Ghostty Terminal
${HOME}/.config/ghostty/config|${DOTFILES_ROOT}/ghostty/config|Ghostty terminal config

# tmux
${HOME}/.tmux.conf|${DOTFILES_ROOT}/tmux/tmux.conf|tmux config

# Obsidian CLI wrapper (issue #1023) — executable on PATH so AI agents'
# non-interactive `bash -c "obsidian ..."` calls resolve it too.
${HOME}/.local/bin/obsidian|${DOTFILES_ROOT}/obsidian/bin/obsidian|Obsidian CLI wrapper (managed by dotfiles)

# schedule-agent-prompt (issue #1768) — a one-shot scheduler that submits a
# prompt into named herdr agent panes. On PATH because the detached waiter
# re-executes itself by absolute path, and because it is never sourced.
${HOME}/.local/bin/schedule-agent-prompt|${DOTFILES_ROOT}/shell-common/tools/custom/schedule_agent_prompt.sh|Scheduled herdr agent prompt injector (managed by dotfiles)

# Shell-state-neutral CLI dispatchers (issue #2155) — PATH executables so AI
# agents' and cron's non-interactive `bash -c` calls resolve them; the same-named
# functions in shell-common/functions/ are thin wrappers for interactive shells.
${HOME}/.local/bin/gcp-scan|${DOTFILES_ROOT}/shell-common/tools/custom/gcp_scan.sh|gcp scan cherry-pick scanner (managed by dotfiles)
${HOME}/.local/bin/gh-audit-builtin-workflows|${DOTFILES_ROOT}/shell-common/tools/custom/gh_audit_builtin_workflows.sh|projectV2 builtin workflow audit (managed by dotfiles)
${HOME}/.local/bin/ghes-mirror|${DOTFILES_ROOT}/shell-common/tools/custom/ghes_mirror.sh|GHES mirror wizard (managed by dotfiles)
${HOME}/.local/bin/ai-usage|${DOTFILES_ROOT}/shell-common/tools/custom/ai_usage.sh|AI CLI token usage recorder (managed by dotfiles)
${HOME}/.local/bin/wsl-check|${DOTFILES_ROOT}/shell-common/tools/custom/wsl_check.sh|WSL and Docker health check (managed by dotfiles)

# herdr (agent multiplexer) — the running server reads the live path, so the
# symlink is what makes the dotfiles copy authoritative.
${HOME}/.config/herdr/config.toml|${DOTFILES_ROOT}/herdr/config.toml|herdr config (managed by dotfiles)

# Hermes Agent (#1373) — deliberately NOT listed here. ~/.hermes/config.yaml is
# copied once from hermes/config.yaml by hermes/setup.sh Part 1, never
# symlinked: hermes rewrites that file itself (OAuth setup, model selection,
# _config_version), and a symlink would push those writes through into the
# tracked template. Re-adding an entry here would restore that leak.
